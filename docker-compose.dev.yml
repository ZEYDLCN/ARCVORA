# Yerel geliştirme için yalnızca PostgreSQL. API ve web `dotnet run` / `npm run dev` ile çalışır.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arcvora
    ports: ['5432:5432']
    volumes: [arcvora-pg:/var/lib/postgresql/data]
volumes:
  arcvora-pg:

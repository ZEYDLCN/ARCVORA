name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + testler)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCVORA_TEST_PG: Host=localhost;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Arcvora.sln
      - name: Build (uyarılar hata sayılır)
        run: dotnet build Arcvora.sln --no-restore -c Release
      - name: Birim testleri
        run: dotnet test tests/Arcvora.Core.Tests --no-build -c Release
      - name: Entegrasyon testleri (gerçek PostgreSQL)
        run: dotnet test tests/Arcvora.Integration.Tests --no-build -c Release
      - name: Migrasyonlar model anlık görüntüsüyle uyumlu mu?
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes -p src/Arcvora.Infrastructure -s src/Arcvora.Infrastructure

  web:
    name: Web (tip denetimi + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
